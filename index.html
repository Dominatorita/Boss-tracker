<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Throne and Liberty - Boss Tracker & Markers</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #090a0f; color: #e1e3e6; margin: 0; padding: 15px; }
    .container { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }
    
    header { display: flex; justify-content: space-between; align-items: center; background: #16181f; padding: 12px 20px; border-radius: 8px; border: 1px solid #272a36; flex-wrap: wrap; gap: 10px; }
    h1 { margin: 0; color: #f39c12; font-size: 1.4em; }
    
    .header-controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .zone-selector { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    select { background: #0d0e12; color: #fff; border: 1px solid #343847; padding: 8px 12px; border-radius: 6px; font-size: 1em; cursor: pointer; font-weight: bold; }
    label { font-size: 0.9em; color: #b0b3b8; }

    .lang-btn { background: #0d0e12; color: #f39c12; border: 1px solid #343847; padding: 7px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 0.85em; letter-spacing: 1px; }
    .lang-btn:hover { background: #f39c12; color: #000; border-color: #f39c12; }

    .viewer-card { position: relative; background: #12141a; border: 3px solid #272a36; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; transition: all 0.3s ease; }
    
    .img-display-area { position: relative; width: 100%; height: 68vh; min-height: 450px; background: #050507; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: crosshair; }
    
    .img-wrapper { position: relative; display: inline-block; max-width: 100%; max-height: 100%; }
    .img-display-area img { display: block; max-width: 100%; max-height: 68vh; width: auto; height: auto; object-fit: contain; image-rendering: -webkit-optimize-contrast; user-select: none; }
    
    .map-marker { position: absolute; width: 30px; height: 30px; background: #f39c12; color: #000; border: 2px solid #fff; border-radius: 50%; font-weight: 900; font-size: 0.9em; display: flex; align-items: center; justify-content: center; transform: translate(-50%, -50%); cursor: pointer; box-shadow: 0 0 10px rgba(0,0,0,0.8); z-index: 4; transition: transform 0.1s; }
    .map-marker:hover { transform: translate(-50%, -50%) scale(1.2); background: #e74c3c; color: #fff; }

    .found-banner { display: none; position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: #2ecc71; color: #041f0c; font-weight: 900; padding: 10px 25px; border-radius: 40px; font-size: 1.3em; letter-spacing: 1px; z-index: 10; box-shadow: 0 0 25px #2ecc71; text-transform: uppercase; border: 2px solid #ffffff; text-align: center; pointer-events: none; }
    .found-banner .timer-badge { display: block; font-size: 0.85em; font-family: monospace; font-weight: bold; background: rgba(0,0,0,0.3); color: #ffffff; padding: 3px 12px; border-radius: 12px; margin-top: 4px; letter-spacing: 1px; }
    
    .respawn-banner { display: none; position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: #e67e22; color: #ffffff; font-weight: 900; padding: 12px 30px; border-radius: 40px; font-size: 1.3em; letter-spacing: 1px; z-index: 10; box-shadow: 0 0 30px #e67e22; text-transform: uppercase; border: 2px solid #ffffff; text-align: center; animation: pulse-glow 1.5s infinite alternate; pointer-events: none; }

    @keyframes pulse-glow {
      0% { transform: translateX(-50%) scale(1); box-shadow: 0 0 20px #e67e22; }
      100% { transform: translateX(-50%) scale(1.03); box-shadow: 0 0 40px #e74c3c; background: #e74c3c; }
    }

    .viewer-card.boss-found { border-color: #2ecc71 !important; box-shadow: 0 0 40px rgba(46, 204, 113, 0.45); }
    .viewer-card.boss-found .found-banner { display: block; }
    
    .viewer-card.boss-respawned { border-color: #e67e22 !important; box-shadow: 0 0 40px rgba(230, 126, 34, 0.6); }
    .viewer-card.boss-respawned .respawn-banner { display: block; }

    .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0, 0, 0, 0.8); color: #f39c12; border: 1px solid #444; font-size: 2.2em; width: 55px; height: 55px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 5; transition: 0.2s; user-select: none; }
    .nav-btn:hover { background: #f39c12; color: #000; border-color: #f39c12; }
    .nav-btn.prev { left: 20px; }
    .nav-btn.next { right: 20px; }

    .photo-counter { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.85); color: #fff; padding: 6px 16px; border-radius: 20px; font-size: 0.85em; z-index: 5; border: 1px solid #444; pointer-events: none; }

    .control-panel { padding: 15px 20px; background: #16181f; display: flex; flex-wrap: wrap; gap: 15px; align-items: center; justify-content: space-between; border-top: 1px solid #272a36; z-index: 2; }
    .add-inputs { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; flex: 1; min-width: 300px; }
    .input-url { flex: 1; min-width: 200px; background: #0d0e12; border: 1px solid #272a36; color: #fff; padding: 9px 12px; border-radius: 6px; font-size: 0.9em; }
    
    .btn { background: #2c3e50; color: #fff; border: none; padding: 9px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; white-space: nowrap; }
    .btn:hover { background: #34495e; }
    .btn-reset { background: #d35400; color: #fff; }
    .btn-reset:hover { background: #e67e22; }
    .btn-clear-markers { background: #c0392b; color: #fff; }
    .btn-clear-markers:hover { background: #e74c3c; }
    
    .btn-toggle-boss { background: #2ecc71; color: #041f0c; font-size: 0.95em; padding: 9px 18px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; white-space: nowrap; }
    .btn-toggle-boss.found { background: #e74c3c; color: #fff; }
    .btn-toggle-boss.respawned { background: #e67e22; color: #fff; }

    .btn-delete { background: #5c2424; color: #ffaaaa; }
    .btn-delete:hover { background: #822828; }
    .placeholder-text { color: #8a8f9d; font-size: 1em; text-align: center; line-height: 1.5; padding: 20px; }
    .error-msg { color: #e74c3c; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Boss Area Viewer & GPS Markers</h1>
      
      <div class="header-controls">
        <div class="zone-selector">
          <label for="regionSelect" id="uiRegionLabel">Regione:</label>
          <select id="regionSelect" onchange="changeRegion(this.value)">
            <option value="TALANDRE">Talandre</option>
            <option value="NIX">Nix</option>
          </select>

          <label for="zoneSelect" id="uiZoneLabel">Zona:</label>
          <select id="zoneSelect" onchange="changeZone(this.value)"></select>
        </div>
        <button class="lang-btn" id="langBtn" onclick="toggleLanguage()">EN</button>
      </div>
    </header>

    <div class="viewer-card" id="viewerCard">
      <div class="found-banner">
        <span id="uiFoundText">Boss Trovato In Questa Zona ✓</span>
        <span class="timer-badge" id="timerDisplay">Respawn: 60:00</span>
      </div>

      <div class="respawn-banner" id="uiRespawnBanner">
        🔔 Boss Ricomparso in questa zona!
      </div>
      
      <div class="img-display-area" id="imgDisplayArea">
        <!-- Contenuto Immagine -->
      </div>

      <button class="nav-btn prev" onclick="prevZone()" title="Zona Precedente (◄)">&#10094;</button>
      <button class="nav-btn next" onclick="nextZone()" title="Zona Successiva (►)">&#10095;</button>

      <div class="control-panel">
        <div class="add-inputs">
          <input type="text" id="urlInput" class="input-url" placeholder="Incolla link immagine...">
          <button class="btn" id="uiAddUrlBtn" onclick="addUrlImage()">Aggiungi URL</button>
          <span style="color:#666;" id="uiOrText">o</span>
          <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="uploadLocalImage(event)">
          <button class="btn" id="uiUploadFileBtn" onclick="document.getElementById('fileInput').click()">Carica File</button>
        </div>

        <div style="display:flex; gap:10px; flex-wrap: wrap;">
          <button class="btn btn-clear-markers" id="uiClearMarkersBtn" onclick="clearCurrentMarkers()">Pulisci Marker</button>
          <button class="btn btn-delete" id="uiDeleteBtn" onclick="deleteCurrentImage()">Elimina Foto</button>
          <button class="btn btn-reset" id="uiResetBtn" onclick="resetDefaultImages()">Ripristina</button>
          <button class="btn-toggle-boss" id="btnToggleBoss" onclick="toggleBossState()">Segna come Trovato</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_PREFIX = 'bt_markers_';

    const i18n = {
      it: {
        regionLabel: "Regione:",
        zoneLabel: "Zona:",
        foundBanner: "Boss Trovato In Questa Zona ✓",
        respawnBannerText: "🔔 Boss Ricomparso in questa zona!",
        respawnText: "Respawn in",
        markFound: "Segna Boss come Trovato",
        markMissing: "Segna come Mancante",
        clearRespawn: "Riconferma / Azzera Notifica",
        placeholderUrl: "Incolla link immagine...",
        addUrlBtn: "Aggiungi URL",
        orText: "o",
        uploadFileBtn: "Carica File",
        resetBtn: "Ripristina",
        deleteBtn: "Elimina Foto",
        clearMarkersBtn: "Pulisci Marker",
        noPhotos: "Nessuna foto presente per questa zona.<br>Aggiungi un URL o carica un file dal dispositivo.",
        errorPhoto: "⚠️ Immagine non trovata nella cartella \"img/\".",
        zoneWord: "Zona",
        ofWord: "di",
        langBtnText: "EN"
      },
      en: {
        regionLabel: "Region:",
        zoneLabel: "Zone:",
        foundBanner: "Boss Found In This Zone ✓",
        respawnBannerText: "🔔 Boss Respawned in this zone!",
        respawnText: "Respawn in",
        markFound: "Mark Boss as Found",
        markMissing: "Mark as Missing",
        clearRespawn: "Acknowledge / Clear Alert",
        placeholderUrl: "Paste image link...",
        addUrlBtn: "Add URL",
        orText: "or",
        uploadFileBtn: "Upload File",
        resetBtn: "Reset",
        deleteBtn: "Delete Photo",
        clearMarkersBtn: "Clear Markers",
        noPhotos: "No photos available for this zone.<br>Add an image URL or upload a file.",
        errorPhoto: "⚠️ Image not found in \"img/\" folder.",
        zoneWord: "Zone",
        ofWord: "of",
        langBtnText: "IT"
      }
    };

    const zonesList = [
      // REGIONE: TALANDRE (1 - 19)
      { num: 1, name: '1. Akidu Valley', region: 'TALANDRE' },
      { num: 2, name: '2. Manawastes', region: 'TALANDRE' },
      { num: 3, name: '3. Daybreak Shore', region: 'TALANDRE' },
      { num: 4, name: '4. The Raging Wilds', region: 'TALANDRE' },
      { num: 5, name: '5. Abandoned Stonemason Town', region: 'TALANDRE' },
      { num: 6, name: '6. Monolith Wastelands', region: 'TALANDRE' },
      { num: 7, name: '7. Sandworm Lair', region: 'TALANDRE' },
      { num: 8, name: '8. Nesting Grounds', region: 'TALANDRE' },
      { num: 9, name: '9. Urstella Fields', region: 'TALANDRE' },
      { num: 10, name: '10. Carmine Forest', region: 'TALANDRE' },
      { num: 11, name: '11. Shattered Temple', region: 'TALANDRE' },
      { num: 12, name: '12. Ruins of Turayne', region: 'TALANDRE' },
      { num: 13, name: '13. Fonos Basin', region: 'TALANDRE' },
      { num: 14, name: '14. Swamp of Silence', region: 'TALANDRE' },
      { num: 15, name: '15. Black Anvil Forge', region: 'TALANDRE' },
      { num: 16, name: '16. Crimson Mansion', region: 'TALANDRE' },
      { num: 17, name: '17. Bercant Manor', region: 'TALANDRE' },
      { num: 18, name: "18. Quietis's Demesne", region: 'TALANDRE' },
      { num: 19, name: '19. Grayclaw Forest', region: 'TALANDRE' },

      // REGIONE: NIX (20 - 24)
      { num: 20, name: '20. Sailor Sorrel', region: 'NIX' },
      { num: 21, name: '21. Frosteye Watcher', region: 'NIX' },
      { num: 22, name: '22. Knight Capitan Ranvier', region: 'NIX' },
      { num: 23, name: '23. Mutant Beast', region: 'NIX' },
      { num: 24, name: '24. Taurk Fighter', region: 'NIX' }
    ];

    const zones = zonesList.map(z => ({
      id: `zone_${z.num}`,
      name: z.name,
      num: z.num,
      region: z.region,
      defaultImages: [
        `img/${z.num}.jpg`,
        `img/${z.num}.png`,
        `img/${z.num}.jpeg`,
        `img/${z.num}`
      ]
    }));

    let currentRegion = 'TALANDRE';
    let currentZoneId = zones[0].id;
    let currentImgIndex = 0;
    let currentLang = localStorage.getItem(STORAGE_PREFIX + 'lang') || 'it';
    const ONE_HOUR_MS = 60 * 60 * 1000;

    function init() {
      updateLanguageUI();
      populateRegionSelect();
      populateZoneSelect();
      renderViewer();

      setInterval(checkAndTickTimers, 1000);

      document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') return;
        if (e.key === 'ArrowLeft') prevZone();
        if (e.key === 'ArrowRight') nextZone();
      });
    }

    function toggleLanguage() {
      currentLang = currentLang === 'it' ? 'en' : 'it';
      localStorage.setItem(STORAGE_PREFIX + 'lang', currentLang);
      updateLanguageUI();
      renderViewer();
    }

    function updateLanguageUI() {
      const t = i18n[currentLang];
      document.getElementById('uiRegionLabel').textContent = t.regionLabel;
      document.getElementById('uiZoneLabel').textContent = t.zoneLabel;
      document.getElementById('uiFoundText').textContent = t.foundBanner;
      document.getElementById('uiRespawnBanner').textContent = t.respawnBannerText;
      document.getElementById('urlInput').placeholder = t.placeholderUrl;
      document.getElementById('uiAddUrlBtn').textContent = t.addUrlBtn;
      document.getElementById('uiOrText').textContent = t.orText;
      document.getElementById('uiUploadFileBtn').textContent = t.uploadFileBtn;
      document.getElementById('uiResetBtn').textContent = t.resetBtn;
      document.getElementById('uiDeleteBtn').textContent = t.deleteBtn;
      document.getElementById('uiClearMarkersBtn').textContent = t.clearMarkersBtn;
      document.getElementById('langBtn').textContent = t.langBtnText;
    }

    function getZoneData(zoneId) {
      const saved = localStorage.getItem(STORAGE_PREFIX + zoneId);
      if (saved) return JSON.parse(saved);

      const zoneObj = zones.find(z => z.id === zoneId);
      return { 
        images: [...zoneObj.defaultImages], 
        markers: {}, 
        found: false, 
        expiresAt: null, 
        respawned: false 
      };
    }

    function saveZoneData(zoneId, data) {
      localStorage.setItem(STORAGE_PREFIX + zoneId, JSON.stringify(data));
    }

    function populateRegionSelect() {
      const regSelect = document.getElementById('regionSelect');
      regSelect.value = currentRegion;
    }

    function populateZoneSelect() {
      const select = document.getElementById('zoneSelect');
      const now = Date.now();

      const filteredZones = zones.filter(z => z.region === currentRegion);

      select.innerHTML = filteredZones.map(z => {
        const data = getZoneData(z.id);
        let statusBadge = "";

        if (data.respawned) {
          statusBadge = " 🔔 [RICOMPARSO!]";
        } else if (data.found && data.expiresAt) {
          const diff = data.expiresAt - now;
          if (diff > 0) {
            const mins = Math.floor(diff / 60000);
            statusBadge = ` ⏳ [${mins}m]`;
          }
        }

        return `<option value="${z.id}">${z.name}${statusBadge}</option>`;
      }).join('');

      select.value = currentZoneId;
    }

    function changeRegion(reg) {
      currentRegion = reg;
      const firstZoneInReg = zones.find(z => z.region === currentRegion);
      if (firstZoneInReg) {
        currentZoneId = firstZoneInReg.id;
      }
      populateZoneSelect();
      currentImgIndex = 0;
      renderViewer();
    }

    function changeZone(zoneId) {
      currentZoneId = zoneId;
      currentImgIndex = 0;
      renderViewer();
    }

    function renderViewer() {
      const t = i18n[currentLang];
      const data = getZoneData(currentZoneId);
      const card = document.getElementById('viewerCard');
      const imgArea = document.getElementById('imgDisplayArea');
      const toggleBtn = document.getElementById('btnToggleBoss');
      const currentZoneIndex = zones.findIndex(z => z.id === currentZoneId);
      const currentZoneObj = zones[currentZoneIndex];

      if (currentZoneObj && currentZoneObj.region !== currentRegion) {
        currentRegion = currentZoneObj.region;
        document.getElementById('regionSelect').value = currentRegion;
        populateZoneSelect();
      }

      card.classList.remove('boss-found', 'boss-respawned');
      toggleBtn.classList.remove('found', 'respawned');

      if (data.respawned) {
        card.classList.add('boss-respawned');
        toggleBtn.textContent = t.clearRespawn;
        toggleBtn.classList.add('respawned');
      } else if (data.found) {
        card.classList.add('boss-found');
        toggleBtn.textContent = t.markMissing;
        toggleBtn.classList.add('found');
        updateTimerBadgeDisplay(data.expiresAt);
      } else {
        toggleBtn.textContent = t.markFound;
      }

      if (data.images && data.images.length > 0) {
        if (currentImgIndex >= data.images.length) currentImgIndex = data.images.length - 1;
        if (currentImgIndex < 0) currentImgIndex = 0;

        imgArea.innerHTML = `
          <div class="img-wrapper" id="imgWrapper" onclick="handleImageClick(event)">
            <img src="${data.images[currentImgIndex]}" 
                 alt="Mappa Area" 
                 onerror="tryNextFallbackExtension(this)">
            <div id="markersContainer"></div>
          </div>
          <div class="photo-counter">[${currentZoneObj.region}] ${t.zoneWord} ${currentZoneIndex + 1} ${t.ofWord} ${zones.length} — ${currentZoneObj.name} (◄ ►)</div>
        `;

        renderMarkers();
      } else {
        imgArea.innerHTML = `
          <div class="placeholder-text">${t.noPhotos}</div>
          <div class="photo-counter">[${currentZoneObj.region}] ${t.zoneWord} ${currentZoneIndex + 1} ${t.ofWord} ${zones.length} — ${currentZoneObj.name}</div>
        `;
      }
    }

    function renderMarkers() {
      const data = getZoneData(currentZoneId);
      if (!data.markers) data.markers = {};
      const photoMarkers = data.markers[currentImgIndex] || [];
      const container = document.getElementById('markersContainer');
      if (!container) return;

      container.innerHTML = '';

      photoMarkers.forEach((m, idx) => {
        const markerElem = document.createElement('div');
        markerElem.className = 'map-marker';
        markerElem.style.left = `${m.x}%`;
        markerElem.style.top = `${m.y}%`;
        markerElem.textContent = idx + 1;
        markerElem.title = `Marker #${idx + 1}`;
        
        markerElem.onclick = function(e) {
          e.stopPropagation();
          photoMarkers.splice(idx, 1);
          data.markers[currentImgIndex] = photoMarkers;
          saveZoneData(currentZoneId, data);
          renderMarkers();
        };

        container.appendChild(markerElem);
      });
    }

    function handleImageClick(e) {
      const wrapper = document.getElementById('imgWrapper');
      const img = wrapper.querySelector('img');
      if (!img) return;

      const rect = img.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      if (clickX < 0 || clickX > rect.width || clickY < 0 || clickY > rect.height) return;

      const xPercent = (clickX / rect.width) * 100;
      const yPercent = (clickY / rect.height) * 100;

      const data = getZoneData(currentZoneId);
      if (!data.markers) data.markers = {};
      if (!data.markers[currentImgIndex]) data.markers[currentImgIndex] = [];

      data.markers[currentImgIndex].push({ x: xPercent, y: yPercent });
      saveZoneData(currentZoneId, data);
      renderMarkers();
    }

    function clearCurrentMarkers() {
      const data = getZoneData(currentZoneId);
      if (data.markers && data.markers[currentImgIndex]) {
        data.markers[currentImgIndex] = [];
        saveZoneData(currentZoneId, data);
        renderMarkers();
      }
    }

    function updateTimerBadgeDisplay(expiresAt) {
      if (!expiresAt) return;
      const t = i18n[currentLang];
      const diff = expiresAt - Date.now();
      if (diff <= 0) return;

      const totalSec = Math.floor(diff / 1000);
      const mins = Math.floor(totalSec / 60);
      const secs = totalSec % 60;
      const formatted = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      
      document.getElementById('timerDisplay').textContent = `${t.respawnText}: ${formatted}`;
    }

    function checkAndTickTimers() {
      const now = Date.now();
      let stateChanged = false;

      zones.forEach(z => {
        const data = getZoneData(z.id);
        if (data.found && data.expiresAt && now >= data.expiresAt) {
          data.found = false;
          data.expiresAt = null;
          data.respawned = true;
          saveZoneData(z.id, data);
          stateChanged = true;
        }
      });

      if (stateChanged) {
        populateZoneSelect();
        renderViewer();
      } else {
        const activeData = getZoneData(currentZoneId);
        if (activeData.found && activeData.expiresAt) {
          updateTimerBadgeDisplay(activeData.expiresAt);
        }
      }
    }

    function prevZone() {
      const currentIndex = zones.findIndex(z => z.id === currentZoneId);
      const newIndex = (currentIndex - 1 + zones.length) % zones.length;
      currentZoneId = zones[newIndex].id;
      currentRegion = zones[newIndex].region;
      document.getElementById('regionSelect').value = currentRegion;
      populateZoneSelect();
      currentImgIndex = 0;
      renderViewer();
    }

    function nextZone() {
      const currentIndex = zones.findIndex(z => z.id === currentZoneId);
      const newIndex = (currentIndex + 1) % zones.length;
      currentZoneId = zones[newIndex].id;
      currentRegion = zones[newIndex].region;
      document.getElementById('regionSelect').value = currentRegion;
      populateZoneSelect();
      currentImgIndex = 0;
      renderViewer();
    }

    function tryNextFallbackExtension(imgElem) {
      const data = getZoneData(currentZoneId);
      if (data.images.length > 1 && currentImgIndex < data.images.length - 1) {
        data.images.splice(currentImgIndex, 1);
        saveZoneData(currentZoneId, data);
        renderViewer();
      } else {
        imgElem.style.display = 'none';
        const imgArea = document.getElementById('imgDisplayArea');
        const errDiv = document.createElement('div');
        errDiv.className = 'placeholder-text error-msg';
        errDiv.innerHTML = i18n[currentLang].errorPhoto;
        imgArea.prepend(errDiv);
      }
    }

    function resetDefaultImages() {
      zones.forEach(z => {
        localStorage.removeItem(STORAGE_PREFIX + z.id);
      });
      localStorage.removeItem(STORAGE_PREFIX + 'lang');

      currentImgIndex = 0;
      populateZoneSelect();
      renderViewer();
      alert(currentLang === 'it' ? 'Dati e marker ripristinati!' : 'Data and markers reset!');
    }

    function addUrlImage() {
      const urlInput = document.getElementById('urlInput');
      const val = urlInput.value.trim();
      if (!val) return;

      const data = getZoneData(currentZoneId);
      data.images.push(val);
      saveZoneData(currentZoneId, data);
      
      currentImgIndex = data.images.length - 1;
      urlInput.value = '';
      renderViewer();
    }

    function uploadLocalImage(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const data = getZoneData(currentZoneId);
        data.images.push(evt.target.result);
        saveZoneData(currentZoneId, data);
        currentImgIndex = data.images.length - 1;
        renderViewer();
      };
      reader.readAsDataURL(file);
    }

    function deleteCurrentImage() {
      const data = getZoneData(currentZoneId);
      if (data.images.length === 0) return;

      data.images.splice(currentImgIndex, 1);
      if (data.markers) {
        delete data.markers[currentImgIndex];
      }

      saveZoneData(currentZoneId, data);
      renderViewer();
    }

    function toggleBossState() {
      const data = getZoneData(currentZoneId);

      if (data.respawned) {
        data.respawned = false;
        data.found = false;
        data.expiresAt = null;
      } else {
        data.found = !data.found;

        if (data.found) {
          data.expiresAt = Date.now() + ONE_HOUR_MS;
          data.respawned = false;
        } else {
          data.expiresAt = null;
        }
      }

      saveZoneData(currentZoneId, data);
      populateZoneSelect();
      renderViewer();
    }

    init();
  </script>
</body>
</html>
